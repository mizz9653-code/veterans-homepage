<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>베테랑스에듀</title>
<style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff}body{display:grid;place-items:center}.box{text-align:center;color:#555}.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:#333;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 16px}@keyframes r{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="spin"></div><div>페이지를 불러오는 중입니다…</div></div>
<script>
(async()=>{
  const target='./베테랑스에듀.html';
  try{
    const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    const open=()=>{
      if(navigator.serviceWorker.controller){
        const ch=new MessageChannel();
        ch.port1.onmessage=e=>{if(e.data==='ready') location.href=target;};
        (navigator.serviceWorker.controller||reg.active).postMessage({type:'precache'},[ch.port2]);
      }
    };
    if(navigator.serviceWorker.controller) open();
    else navigator.serviceWorker.addEventListener('controllerchange',open,{once:true});
  }catch(e){document.querySelector('.box').innerHTML='<b>페이지를 불러오지 못했습니다.</b><br><small>'+e+'</small>'}
})();
</script>
</body>
</html>
