name: Deploy Veterans Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build a static copy of the homepage
        run: |
          set -e
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 --compressed \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36' \
            -e 'https://veteransedu.net/' \
            'https://veteransedu.net/' \
            -o site/index.html
          test -s site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
